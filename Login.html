<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Administrator — E-Tamu PUPR Kota Gorontalo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <?!= include('Styles'); ?>
</head>
<body class="login-page-bg">

  <div class="login-wrapper">
    <div class="login-card">
      
      <!-- Brand & Icon -->
      <div class="login-brand-header">
        <div class="login-logo-circle" style="display:flex; justify-content:center; align-items:center;">
          <img src="https://i.ibb.co/6cwHWvKZ/LOGO-KOTA-GORONTALO.png" alt="Logo Kota Gorontalo" style="width: 52px; height: 52px; object-fit: contain;" />
        </div>
        <span class="instansi-badge">DINAS PUPR KOTA GORONTALO</span>
        <h2 class="login-title">Login Administrator</h2>
        <p class="login-subtitle">Masuk untuk mengelola data kunjungan tamu dan rekapitulasi pelayanan.</p>
      </div>

      <!-- Alert Box -->
      <div class="alert-box alert-error hidden" id="loginAlert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="loginAlertMsg">Username atau password salah.</span>
      </div>

      <!-- Login Form -->
      <form id="formLogin" novalidate>
        
        <div class="form-group">
          <label class="form-label" for="loginUsername">Username Admin</label>
          <div class="input-with-icon">
            <input 
              type="text" 
              id="loginUsername" 
              class="form-control" 
              placeholder="Masukkan username" 
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-wrapper">
            <input 
              type="password" 
              id="loginPassword" 
              class="form-control" 
              placeholder="Masukkan password" 
              required
              autocomplete="current-password"
            >
            <button type="button" class="btn-toggle-pass" id="btnTogglePass" title="Tampilkan/Sembunyikan Password">
              <svg id="iconEye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="iconEyeOff" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary btn-block">
          <span class="btn-text">Masuk ke Dashboard</span>
          <span class="spinner hidden" id="spinnerLogin"></span>
        </button>

      </form>

      <!-- Back to Home Link -->
      <div class="login-footer">
        <a href="?page=home" class="link-back-home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Kembali ke Buku Tamu
        </a>
      </div>

      <!-- Security Notice -->
      <div class="security-card-footer">
        <span>Sesi login aman terenkripsi (Server-side Session & SHA-256 Hashing).</span>
      </div>

    </div>
  </div>

  <?!= include('Scripts'); ?>
</body>
</html>
